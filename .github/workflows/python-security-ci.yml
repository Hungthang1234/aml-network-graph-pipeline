name: Python Security/Lint/Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"

      - name: Install project dependencies if present
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found; skipping project dependency install."
          fi

      - name: Detect Python files
        id: python-files
        shell: bash
        run: |
          if git ls-files '*.py' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lint/security tooling
        if: steps.python-files.outputs.found == 'true'
        run: pip install ruff bandit

      - name: Ruff lint
        if: steps.python-files.outputs.found == 'true'
        run: ruff check .

      - name: Bandit security scan
        if: steps.python-files.outputs.found == 'true'
        run: bandit -q -r . -x .venv,venv

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ] || git ls-files '*test*.py' | grep -q .; then
            pip install pytest
            pytest -q
          else
            echo "No tests found; skipping pytest."
          fi
